plugins {
    id 'info.solidsoft.pitest' version '1.19.0'
}

apply plugin: 'jacoco'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation project(':common:snowflake')
    implementation project(':common:pagination')
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jackson'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'com.navercorp.fixturemonkey:fixture-monkey:1.2.1'
    testImplementation('org.pitest:pitest-junit5-plugin:1.2.3') {
        exclude group: 'org.junit.platform', module: 'junit-platform-launcher'
    }
    testImplementation 'org.junit.platform:junit-platform-launcher:6.0.3'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

pitest {
    junit5PluginVersion = '1.2.3'
    targetClasses = [
            'kuke.kukeboard.comment.service.CommentService',
            'kuke.kukeboard.comment.entity.Comment',
            'kuke.kukeboard.comment.service.response.CommentResponse'
    ]
    targetTests = ['kuke.kukeboard.comment.*']
    outputFormats = ['HTML']
    timestampedReports = false
    threads = 4
}
